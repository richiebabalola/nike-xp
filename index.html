if(page==='PLAY')body=`<div class="mono">01 / PHYSICAL WORLD [ON]</div><h1>REAL LIFE.<br><span class="serif">Extra life.</span></h1><div class="desc">Your world is the next level. Get active. Earn XP.</div><div class="section">MISSIONS / ${done.length} OF 3 COMPLETE</div><div class="cards">${missions.map(mission).join('')}</div>`;
if(page==='VAULT')body=`<div class="mono">02 / DIGITAL × PHYSICAL ASSETS</div><h1>THE<br><span class="serif">Vault.</span></h1>${wallet()}<div class="cards">${rewards.map((r,i)=>`<div class="card">${art(r[3])}<h3>${r[0]}</h3><div class="desc">${r[1]}</div><div class="mono volt" style="margin-top:9px">${r[2]} XP</div><button class="action full" data-buy="${i}" ${owned.includes(i)||xp<r[2]?'disabled':''}>${owned.includes(i)?'UNLOCKED ✓':xp<r[2]?'INSUFFICIENT XP':'UNLOCK ASSET ↗'}</button></div>`).join('')}</div>`;
if(page==='XP')body=`<div class="mono">03 / CROSS-WORLD ECONOMY</div><h1>VALUE<br><span class="serif">in motion.</span></h1>${art('token')}${wallet()}<div class="panel"><div class="line mono"><span>TRANSFER PROTOCOL</span><button class="outline" data-rev="1">⇄ REVERSE</button></div><div class="line" style="margin:20px 0"><div><div class="mono">FROM</div><div class="num">${rev?100:500}</div><div class="mono">${rev?'GAME POINTS':'NIKE XP'}</div></div><span>→</span><div><div class="mono">TO</div><div class="num">${rev?500:100}</div><div class="mono">${rev?'NIKE XP':'GAME POINTS'}</div></div></div><select id="platform" aria-label="Game platform"><option ${platform==='EA SPORTS FC'?'selected':''}>EA SPORTS FC</option><option ${platform==='FORTNITE'?'selected':''}>FORTNITE</option></select><p class="mono">DEMO GAME WALLET: ${game} POINTS</p><button class="action full" data-transfer="1" ${(rev?game<100:xp<500)?'disabled':''}>EXECUTE TRANSFER ↗</button><p class="desc">Illustrative currency exchange. No real game accounts are connected.</p></div>`;
if(page==='WORLD')body=`<div class="mono">04 / THE PLAYERVERSE</div><h1>WE ARE<br><span class="serif">players.</span></h1><div class="hero" style="height:280px">${avatar}<div class="overlay"><span class="tag" style="align-self:start">COMMUNITY_001 / LONDON</span><div><h3 style="font-size:30px">STREETS VS SCREENS.</h3><button class="action" data-join="1" ${joined?'disabled':''}>${joined?'CONNECTED ✓':'JOIN NETWORK ↗'}</button></div></div></div><div class="section">NETWORK / RANKINGS</div><div class="panel">${[['COURTKID',4200],['OFFLINE FC',3100],['YOU',total],['CTRL RUNNER',1100]].sort((a,b)=>b[1]-a[1]).map((r,i)=>`<div class="line rank"><span class="mono">0${i+1}</span><b>${r[0]}</b><span class="mono volt">${r[1].toLocaleString()} XP</span></div>`).join('')}</div><div class="section">COMMUNITY / FEED</div><div class="card">${art('court')}<h3>LOGGED OFF. SHOWED UP.</h3><div class="desc">COURTKID / 30-minute court session.</div><button class="outline full" data-like="1">${liked?'♥ 28':'♡ 27'} LIKES</button></div>`;
root.innerHTML=`<header><div class="logo">${swoosh}<br>.XP</div><button class="outline" data-wide="1">${wide?'CONSOLE':'MOBILE'} / SWITCH VIEW</button></header><main class="shell ${wide?'wide':''}">${msg?`<div class="status" role="status">${msg}</div>`:''}${body}<div class="foot">NIKE_XP / SYSTEM_003 / WORLD [ON]<br>PHYSICAL × DIGITAL · CONCEPT SIMULATION<br><button class="outline" data-reset="1" style="margin-top:8px">RESET EXPERIENCE</button></div></main><nav>${[['ID','◎'],['PLAY','⌖'],['VAULT','◇'],['XP','⇄'],['WORLD','⊕']].map(p=>`<button data-p="${p[0]}" class="${page===p[0]?'active':''}"><span>${p[1]}</span>${p[0]}</button>`).join('')}</nav>`;}
root.addEventListener('change',e=>{if(e.target.id==='platform')platform=e.target.value});root.addEventListener('click',e=>{let b=e.target.closest('button');if(!b||b.disabled)return;let d=b.dataset;msg='';if(d.p)page=d.p;if(d.wide)wide=!wide;if(d.reveal){revealed=true;msg='DIGITAL TWIN / FROST MK.01 UNLOCKED'}if(d.m){let m=missions.find(a=>a[0]===d.m);if(!done.includes(d.m)){done.push(d.m);xp+=m[3];total+=m[3];msg='MISSION COMPLETE / +'+m[3]+' XP RECEIVED'}}if(d.buy!==undefined){let i=+d.buy,r=rewards[i];if(!owned.includes(i)&&xp>=r[2]){xp-=r[2];owned.push(i);msg='ASSET UNLOCKED / '+r[0]}}if(d.rev)rev=!rev;if(d.transfer){if(rev&&game>=100){game-=100;xp+=500;msg='TRANSFER COMPLETE / +500 NIKE XP'}else if(!rev&&xp>=500){xp-=500;game+=100;msg='TRANSFER COMPLETE / +100 '+platform+' DEMO POINTS'}}if(d.join){joined=true;msg='NETWORK ACCESS GRANTED'}if(d.like)liked=!liked;if(d.reset){xp=total=1250;game=500;done=[];owned=[];rev=joined=revealed=liked=false;page='ID';wide=false;platform='EA SPORTS FC'}render();if(d.p||msg||d.reset)window.scrollTo(0,0)});render();</script></body></html>
